[package]
name = "harness-json-performance"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Independent measurements. No production dependency or protocol changes.
[workspace]

[dependencies]
harness-domain = { path = "../../crates/domain" }
serde = "1"
serde_json = "1"
simd-json = "=0.18.1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server"] }
jmespath = { version = "0.3", features = ["sync"] }
mimalloc = { version = "=0.1.52", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
