[package]
name = "hash-performance"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
force-soft = ["sha2/force-soft"]

[dependencies]
sha2 = "=0.10.9"
sha2_new = { package = "sha2", version = "=0.11.1" }
blake3 = "1"
serde_json = "1"

[profile.test]
opt-level = 3
debug = false
