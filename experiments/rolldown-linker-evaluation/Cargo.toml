[package]
name = "harness-rolldown-linker-evaluation"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Deliberately isolated: never changes the production workspace/lockfile.
[workspace]

[dependencies]
rolldown = { version = "=1.2.14", default-features = false }
rolldown_common = { version = "=1.2.14", default-features = false }
rolldown_fs = { version = "=1.2.14", default-features = false }
rolldown_resolver = { version = "=1.2.14", default-features = false }
oxc_resolver = { version = "=11.24.3", features = ["yarn_pnp"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "=3.27.0"

[profile.dev]
debug = 0

[profile.test]
debug = 0
