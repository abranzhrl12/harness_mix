[package]
name = "harness-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
harness-domain = { path = "../domain" }
mcpls-core = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
url = "2"

[dev-dependencies]
tempfile = "3"
