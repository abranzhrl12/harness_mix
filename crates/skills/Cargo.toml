[package]
name = "harness-skills"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
harness-domain = { path = "../domain", features = ["schema"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "=0.25.14"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
