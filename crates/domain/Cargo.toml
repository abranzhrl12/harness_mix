[package]
name = "harness-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
schema = ["dep:schemars"]

[dependencies]
encoding_rs = "0.8.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
schemars = { version = "1", optional = true }
