[package]
name = "agent-harness"
version = "0.8.5"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]
members = [
    "crates/domain",
    "crates/ports",
    "crates/application",
    "crates/infra-llm",
    "crates/infra-storage",
    "crates/adapter-tui",
    "crates/cli",
]
default-members = [
    ".",
    "crates/domain",
    "crates/ports",
    "crates/application",
    "crates/infra-llm",
    "crates/infra-storage",
    "crates/adapter-tui",
    "crates/cli",
]
resolver = "3"
exclude = ["vendor/codegraph-native"]

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "io-std", "net"] }
uuid = { version = "1", features = ["v4"] }
harness-domain = { path = "crates/domain", features = ["schema"] }
harness-application = { path = "crates/application" }
tempfile = "3"
ignore = "0.4"
regex = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
roxmltree = "=0.21.1"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks", "limits"] }
codegraph-native = { path = "vendor/codegraph-native" }
oxc_allocator = "=0.90.0"
oxc_ast = "=0.90.0"
oxc_parser = "=0.90.0"
oxc_semantic = "=0.90.0"
oxc_span = "=0.90.0"
oxc_syntax = "=0.90.0"
oxc_resolver = "=11.0.0"
tiberius = { version = "0.13.0", features = ["chrono", "rust_decimal"] }
tokio-postgres = "=0.7.18"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
tokio-util = { version = "0.7.20", features = ["compat"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
calamine = "0.36.1"
jmespath = { version = "0.3", features = ["sync"] }
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
notify = "=8.2.0"
windows = { version = "=0.62.2", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Un binario de depuración sin optimizar es órdenes de magnitud más lento en
# parseo (syn/oxc), SQLite y hashing. Optimizamos igualmente y reducimos los PDB.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
